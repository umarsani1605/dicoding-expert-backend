limit_req_zone $binary_remote_addr zone=threads:10m rate=90r/m;

server {
    server_name tough-bugs-hang-brightly.st.a.dcdg.xyz www.tough-bugs-hang-brightly.st.a.dcdg.xyz;

    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /threads {
        limit_req zone=threads burst=90 nodelay;

        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tough-bugs-hang-brightly.st.a.dcdg.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tough-bugs-hang-brightly.st.a.dcdg.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.tough-bugs-hang-brightly.st.a.dcdg.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = tough-bugs-hang-brightly.st.a.dcdg.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name tough-bugs-hang-brightly.st.a.dcdg.xyz www.tough-bugs-hang-brightly.st.a.dcdg.xyz;
    return 404; # managed by Certbot




}