name: Continuous Integration

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: supersecretpassword
          POSTGRES_DB: forumapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: developer
      PGPASSWORD: supersecretpassword
      PGDATABASE: forumapi_test
      ACCESS_TOKEN_KEY: ci_access_token_key
      REFRESH_TOKEN_KEY: ci_refresh_token_key
      ACCESS_TOKEN_AGE: 3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run migrate up

      - run: npm test
